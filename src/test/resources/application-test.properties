spring.application.name=chat-with-docs-test

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.schema-name=vector_store
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false

spring.ai.provider=lmstudio
spring.ai.openai.base-url=http://localhost:1234
spring.ai.openai.chat.options.model=google/gemma-3-1b
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.embedding.options.model=text-embedding-nomic-embed-text-v2-moe

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

logging.level.root=WARN
logging.level.io.github.kxng0109.chatwithdocs=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.hibernate.SQL=WARN